    <script>
      (function () {
        var entry = document.querySelector('script[src*="src/main.tsx"]');
        if (!entry) return;
        var redirected = false;
        var redirectToDocs = function () {
          if (redirected || window.__DRAMA_APP_MOUNTED) return;
          if (!/^https?:$/.test(location.protocol) || /\/docs(\/|$)/.test(location.pathname)) return;
          redirected = true;
          fetch('./docs/index.html', { method: 'HEAD', cache: 'no-store' })
            .then(function (r) {
              if (r.ok && !window.__DRAMA_APP_MOUNTED) {
                location.replace('./docs/' + location.search + location.hash);
              }
            })
            .catch(function () {});
        };
        entry.addEventListener('error', redirectToDocs);
        setTimeout(redirectToDocs, 1500);
      })();
    </script>
